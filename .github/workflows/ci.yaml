name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: Contract Compilation, Local Network & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile Compact contract
        run: yarn compile

      - name: Start local Midnight network (Docker)
        run: yarn env:up

      - name: Wait for spendable DUST to accrue
        run: npx vite-node scripts/wait-for-dust.ts
        env:
          WAIT_FOR_DUST_MIN_COINS: "10"
          WAIT_FOR_DUST_TIMEOUT_MS: "600000"

      - name: Run test suite against local network
        run: yarn test:local

      - name: Stop local Midnight network
        if: always()
        run: yarn env:down

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
